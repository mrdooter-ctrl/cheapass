name: Refresh prices
on:
  schedule:
    - cron: "0 13 * * *"   # daily 8 AM ET during sales; change to "0 13 * * 1" (Mondays) after Dec 2
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull prices from brand stores
        run: python3 tools/refresh_prices.py --write
      - name: Rebuild pages
        run: python3 tools/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "cheapass-bot"
          git config user.email "cheapass-bot@users.noreply.github.com"
          git add -A index.html deals guides data sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "Price refresh $(date -u +%F)" && git push)
